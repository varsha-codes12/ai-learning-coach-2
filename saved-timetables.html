<!DOCTYPE html>
<html>
<head>
<title>Saved Timetables</title>

<style>

body{
    font-family:Arial;
    background:linear-gradient(135deg, #A7C7E7, #CDB4DB, #FFD6C9);;
    padding:20px;
    
}

.box{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
    
}

button{
    padding:10px 15px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:black;
    color:white;
}

</style>
</head>
<body>

<h1>📅 My Saved Timetables</h1>

<div id="list"></div>

<button onclick="goBack()">⬅ Back</button>

<script>

async function loadTimetables(){

    let username =
    localStorage.getItem("currentUser");

    let res = await fetch(
    "/get-saved-timetables",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({ username })
    });

    let data = await res.json();

    let html = "";

    data.timetables.forEach(t=>{

        html += `
        <div class="box">

            <h2>${t.title}</h2>

            <button onclick="openTT(${t.id})">
            Open
            </button>
            <button 
            onclick="deleteTT(${t.id})"
            style="
            background:red;
            color:white;
            margin-left:10px;
            ">
            Delete
            </button>

        </div>
        `;
    });

    document.getElementById("list").innerHTML =
    html;
}

async function openTT(id){

    let username =
    localStorage.getItem("currentUser");

    let res = await fetch("/open-timetable",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            username,
            id
        })
    });

    let data = await res.json();

    localStorage.setItem(
    "latestTimetable",
    data.content
    );

    window.location.href =
    "timetable.html";
}

async function deleteTT(id){

    let username =
    localStorage.getItem("currentUser");

    await fetch("/delete-timetable",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            username,
            id
        })
    });

    loadTimetables();
}

function goBack(){

    window.location.href =
    "index.html";
}

loadTimetables();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Quiz</title>

<style>

body{
    font-family:Segoe UI;
    background:linear-gradient(135deg, #A7C7E7, #CDB4DB, #FFD6C9);;
    padding:30px;
}

.quiz-box{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.question{
    font-size:20px;
    font-weight:600;
    margin-bottom:15px;
}

.option{
    display:block;
    background:#f5f5f5;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
}

.option:hover{
    background:#ececec;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:black;
    color:white;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
}

#score{
    margin-top:25px;
    font-size:28px;
    font-weight:bold;
    text-align:center;
}

</style>

</head>

<body>

<h1>🧠 AI Generated Quiz</h1>

<div id="quizContainer"></div>

<button onclick="submitQuiz()">
    Submit Quiz
</button>
<button onclick="goDashboard()"
style="margin-top:15px;background:#444;">

    ⬅ Back 

</button>
<div id="score"></div>

<script>

let quizData = JSON.parse(
    localStorage.getItem("quizData")
);

function renderQuiz(){

    let container =
        document.getElementById("quizContainer");

    container.innerHTML = "";

    quizData.forEach((q,index)=>{

        let div = document.createElement("div");

        div.className = "quiz-box";

        let optionsHTML = "";

        q.options.forEach(opt=>{

            optionsHTML += `

            <label class="option">

                <input
                    type="radio"
                    name="q${index}"
                    value="${opt}"
                >

                ${opt}

            </label>

            `;
        });

        div.innerHTML = `

            <div class="question">
                ${index+1}. ${q.question}
            </div>

            ${optionsHTML}

        `;

        container.appendChild(div);
    });
}

function submitQuiz(){

    let score = 0;

    quizData.forEach((q,index)=>{

        let selected =
            document.querySelector(
                `input[name="q${index}"]:checked`
            );

        let allOptions =
            document.querySelectorAll(
                `input[name="q${index}"]`
            );

        allOptions.forEach(opt=>{

            let parent = opt.parentElement;

            parent.style.background = "#f5f5f5";

            // correct answer
            if(opt.value === q.answer){

                parent.style.background =
                    "rgba(0,255,0,0.25)";

                parent.innerHTML += " ✅";
            }

            // wrong selected
            if(
                selected &&
                opt.checked &&
                opt.value !== q.answer
            ){

                parent.style.background =
                    "rgba(255,0,0,0.25)";

                parent.innerHTML += " ❌";
            }
        });

        // score
        if(
            selected &&
            selected.value === q.answer
        ){
            score++;
        }

    });

    document.getElementById("score").innerHTML =

        `🎯 Score: ${score} / ${quizData.length}`;

}
function goDashboard(){
    window.location.href = "index.html";
}
window.onload = () => {

    let storedQuiz =
        localStorage.getItem("quizData");

    if(!storedQuiz){

        window.location.href = "index.html";

        return;
    }

    quizData = JSON.parse(storedQuiz);

    renderQuiz();
};


</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Time Table</title>

<style>

body{
    font-family:Arial;
    background:linear-gradient(135deg, #A7C7E7, #CDB4DB, #FFD6C9);;
    padding:40px;
}

.container{
    background:white;
    padding:30px;
    border-radius:20px;
    max-width:1000px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

input{
    padding:12px;
    margin:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:black;
    color:white;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
}

th,td{
    border:1px solid #ddd;
    padding:15px;
    text-align:left;
}

th{
    background:#6c63ff;
    color:white;
}

.loader{
    display:none;
    margin-top:20px;
    font-size:20px;
}

</style>

</head>
<body>

<div class="container">

<h1>📅 AI Time Table Generator</h1>

<input type="date" id="startDate">

<input type="date" id="endDate">

<button onclick="generateTimeTable()">
Generate Time Table
</button>

<div class="loader" id="loader">
⏳ AI is generating your timetable...
</div>

<div id="tableArea"></div>

<br>

<button onclick="goBack()">⬅ Back</button>

</div>

<script>

async function generateTimeTable(){

    let startDate =
    document.getElementById("startDate").value;

    let endDate =
    document.getElementById("endDate").value;

    if(!startDate || !endDate){

        alert("Select dates");

        return;
    }

    document.getElementById("loader").style.display="block";

    let username =
    localStorage.getItem("currentUser");

    let workspace =
    localStorage.getItem("activeWorkspace");

    let res = await fetch("/generate-timetable",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            username,
            workspace,
            startDate,
            endDate
        })
    });

    let data = await res.json();

    document.getElementById("loader").style.display="none";

    if(data.success){

        localStorage.setItem(
            "latestTimetable",
            data.timetable
        );

        renderTable(data.timetable);

    }else{

        alert(data.message);
    }
}

function renderTable(html){

    document.getElementById("tableArea").innerHTML =
    html;
}

function goBack(){

    window.location.href="index.html";
}

window.onload = ()=>{

    let saved =
    localStorage.getItem("latestTimetable");

    if(saved){

        renderTable(saved);
    }
}

</script>

</body>
</html>
